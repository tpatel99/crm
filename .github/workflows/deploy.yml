name: Deploy to Azure
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    # Skipped until Azure is set up (docs/AZURE.md section 3 sets this variable)
    if: ${{ vars.AZURE_APP != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: az acr build -r "${{ vars.ACR_NAME }}" -t "crm:${{ github.sha }}" -t crm:latest .
      - name: Roll out new image
        run: |
          az containerapp update -g "${{ vars.AZURE_RG }}" -n "${{ vars.AZURE_APP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/crm:${{ github.sha }}"
